<!DOCTYPE html>

</head>
<body>

    <!-- MENÚ 1: Todo a la izquierda -->

    <!-- MENÚ 2: Todo al centro -->

            <a href="#">Inicio</a>
            <a href="#">Servicios</a>

    <!-- MENÚ 3: Todo a la derecha -->

    <!-- MENÚ 2: Todo al logo al centro -->
    <header class="navbar menu-dividido">

        <a href="#">Inicio</a>
        <a href="#">Servicios</a>

    <div class="logo">LogoCentro</div>
